<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANISHQ · slow decrypt to glitch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a000c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      overflow: hidden;
      color: #f2d9ff;
    }

    /* deep magenta-black space */
    .magenta-void {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 40% 50%, #1c001e 0%, #040004 90%);
      isolation: isolate;
    }

    /* particle canvas – magenta/white falling stars */
    #magenta-particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 2;
    }

    /* content layer above particles */
    .core {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 50%, rgba(45, 0, 30, 0.25) 0%, #0b000e 95%);
    }

    /* headline container */
    #decrypted-headline {
      display: inline-block;
      font-size: clamp(4rem, 16vw, 8rem);
      font-weight: 800;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      /* no glow — removed */
    }

    /* parent span style for decrypted (no glow) */
    .decrypt-parent {
      display: inline-block;
      white-space: pre-wrap;
      color: #ffdcff; /* fallback */
    }

    /* letter classes – no glow, just pure magenta tones */
    .magenta-revealed {
      color: #ffdcff;
      /* text-shadow removed – no glow */
    }
    .magenta-encrypted {
      color: #ffa0e0;
      /* no glow */
    }

    /* glitch style (applied after decryption finishes) */
    .glitch-active {
      position: relative;
      color: #f0c0ff;
      animation: glitch-skew 4s infinite step-end;
    }
    .glitch-active::before,
    .glitch-active::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      clip: rect(0, 0, 0, 0);
    }
    .glitch-active::before {
      left: 2px;
      text-shadow: -1px 0 #ff66cc;
      animation: glitch-anim-1 3s infinite linear alternate-reverse;
    }
    .glitch-active::after {
      left: -2px;
      text-shadow: 1px 0 #b30086;
      animation: glitch-anim-2 3.5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(15px, 9999px, 45px, 0); }
      5% { clip: rect(65px, 9999px, 95px, 0); }
      10% { clip: rect(22px, 9999px, 52px, 0); }
      15% { clip: rect(38px, 9999px, 68px, 0); }
      20% { clip: rect(8px, 9999px, 28px, 0); }
      25% { clip: rect(55px, 9999px, 85px, 0); }
      30% { clip: rect(18px, 9999px, 48px, 0); }
      35% { clip: rect(48px, 9999px, 78px, 0); }
      40% { clip: rect(12px, 9999px, 42px, 0); }
      45% { clip: rect(72px, 9999px, 98px, 0); }
      50% { clip: rect(28px, 9999px, 58px, 0); }
      55% { clip: rect(42px, 9999px, 72px, 0); }
      60% { clip: rect(5px, 9999px, 35px, 0); }
      65% { clip: rect(62px, 9999px, 92px, 0); }
      70% { clip: rect(32px, 9999px, 62px, 0); }
      75% { clip: rect(52px, 9999px, 82px, 0); }
      80% { clip: rect(24px, 9999px, 54px, 0); }
      85% { clip: rect(44px, 9999px, 74px, 0); }
      90% { clip: rect(9px, 9999px, 39px, 0); }
      95% { clip: rect(58px, 9999px, 88px, 0); }
      100% { clip: rect(19px, 9999px, 49px, 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip: rect(55px, 9999px, 85px, 0); }
      5% { clip: rect(25px, 9999px, 55px, 0); }
      10% { clip: rect(68px, 9999px, 98px, 0); }
      15% { clip: rect(12px, 9999px, 42px, 0); }
      20% { clip: rect(38px, 9999px, 68px, 0); }
      25% { clip: rect(72px, 9999px, 98px, 0); }
      30% { clip: rect(8px, 9999px, 38px, 0); }
      35% { clip: rect(48px, 9999px, 78px, 0); }
      40% { clip: rect(18px, 9999px, 48px, 0); }
      45% { clip: rect(58px, 9999px, 88px, 0); }
      50% { clip: rect(32px, 9999px, 62px, 0); }
      55% { clip: rect(62px, 9999px, 92px, 0); }
      60% { clip: rect(5px, 9999px, 35px, 0); }
      65% { clip: rect(42px, 9999px, 72px, 0); }
      70% { clip: rect(72px, 9999px, 98px, 0); }
      75% { clip: rect(22px, 9999px, 52px, 0); }
      80% { clip: rect(52px, 9999px, 82px, 0); }
      85% { clip: rect(9px, 9999px, 39px, 0); }
      90% { clip: rect(35px, 9999px, 65px, 0); }
      95% { clip: rect(65px, 9999px, 95px, 0); }
      100% { clip: rect(15px, 9999px, 45px, 0); }
    }
    @keyframes glitch-skew {
      0% { transform: skew(0deg); }
      10% { transform: skew(1deg); }
      20% { transform: skew(-1deg); }
      30% { transform: skew(2deg); }
      40% { transform: skew(-1deg); }
      50% { transform: skew(0deg); }
      60% { transform: skew(1deg); }
      70% { transform: skew(-1deg); }
      80% { transform: skew(1deg); }
      90% { transform: skew(-1deg); }
      100% { transform: skew(0deg); }
    }

    /* tagline container – properly aligned block */
    #decrypted-tagline {
      display: block;
      width: 100%;
      max-width: 900px;
      margin: 0 auto 2.8rem auto;
      font-size: clamp(1rem, 4vw, 1.7rem);
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1.7;
      padding-bottom: 1.2rem;
      border-bottom: 1px dashed #ff66bb;
      text-align: center;
      /* no glow */
    }

    .tagline-parent {
      display: inline-block;
      white-space: pre-wrap;
      color: #ffb0e0;
    }

    /* button – magenta boundary, minimal glow */
    .magenta-boundary {
      background: transparent;
      border: 2px solid #ff77cc;
      border-radius: 0;
      padding: 1rem 4rem;
      font-size: 1.7rem;
      font-weight: 400;
      letter-spacing: 6px;
      color: #ffe0fa;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      background-color: rgba(40, 0, 25, 0.5);
      backdrop-filter: blur(2px);
      box-shadow: 0 0 8px rgba(255, 64, 160, 0.2); /* minimal */
      font-family: inherit;
      margin-top: 0.8rem;
      min-width: 340px;
    }

    .magenta-boundary:hover {
      border-color: #ffaae6;
      background-color: rgba(80, 0, 50, 0.6);
      box-shadow: 0 0 15px rgba(255, 128, 192, 0.3);
      color: white;
      letter-spacing: 8px;
    }

    .magenta-hint {
      font-size: 0.8rem;
      color: #b04c9e;
      margin-top: 1rem;
      letter-spacing: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="magenta-void">
    <canvas id="magenta-particles"></canvas>

    <div class="core">
      <!-- headline injected here -->
      <div id="decrypted-headline"></div>
      <!-- tagline injected here (block, centered) -->
      <div id="decrypted-tagline"></div>

      <button class="magenta-boundary" id="enter-portfolio-btn">ENTER TANISHQ PORTFOLIO</button>
      <div class="magenta-hint">Architecting intelligence in a world still learning to think ✦</div>
    </div>
  </div>

  <script>
    (function() {
      // --------------------------------------------------------------
      // 1. DecryptedText that transitions to glitch after finishing
      //    Slower speed, removes glow, then applies glitch class
      // --------------------------------------------------------------
      function createDecryptedTextWithGlitch(options) {
        const {
          text = '',
          speed = 120,           // slower duration (was 60, now 120ms per step)
          maxIterations = 16,     // more iterations = longer scramble
          sequential = true,
          revealDirection = 'center',
          useOriginalCharsOnly = false,
          characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!@#$%^&*()_+',
          className = 'magenta-revealed',
          parentClassName = 'decrypt-parent',
          encryptedClassName = 'magenta-encrypted',
          animateOn = 'both',
          onComplete = null,      // callback when decryption fully done
        } = options;

        const container = document.createElement('span');
        container.className = parentClassName;
        container.style.display = 'inline-block';
        container.style.whiteSpace = 'pre-wrap';

        // sr-only
        const srSpan = document.createElement('span');
        srSpan.className = 'sr-only';
        srSpan.textContent = text;
        container.appendChild(srSpan);

        const visualSpan = document.createElement('span');
        visualSpan.setAttribute('aria-hidden', 'true');
        container.appendChild(visualSpan);

        // state
        let displayText = text;
        let isHovering = false;
        let isScrambling = false;
        let revealedIndices = new Set();
        let hasAnimated = false;
        let intervalId = null;
        let finished = false;      // becomes true when fully revealed naturally

        // helper
        function getNextIndex(revealedSet) {
          const len = text.length;
          switch (revealDirection) {
            case 'start': return revealedSet.size;
            case 'end': return len - 1 - revealedSet.size;
            case 'center': {
              const middle = Math.floor(len / 2);
              const offset = Math.floor(revealedSet.size / 2);
              let next = revealedSet.size % 2 === 0 ? middle + offset : middle - offset - 1;
              if (next >= 0 && next < len && !revealedSet.has(next)) return next;
              for (let i = 0; i < len; i++) if (!revealedSet.has(i)) return i;
              return 0;
            }
            default: return revealedSet.size;
          }
        }

        function shuffleText(originalText, revealed) {
          const availableChars = useOriginalCharsOnly
            ? Array.from(new Set(originalText.split(''))).filter(c => c !== ' ')
            : characters.split('');

          if (useOriginalCharsOnly) {
            const positions = originalText.split('').map((char, i) => ({
              char,
              isSpace: char === ' ',
              index: i,
              isRevealed: revealed.has(i)
            }));
            const nonSpaceChars = positions.filter(p => !p.isSpace && !p.isRevealed).map(p => p.char);
            for (let i = nonSpaceChars.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [nonSpaceChars[i], nonSpaceChars[j]] = [nonSpaceChars[j], nonSpaceChars[i]];
            }
            let idx = 0;
            return positions.map(p => {
              if (p.isSpace) return ' ';
              if (p.isRevealed) return originalText[p.index];
              return nonSpaceChars[idx++];
            }).join('');
          } else {
            return originalText.split('').map((char, i) => {
              if (char === ' ') return ' ';
              if (revealed.has(i)) return originalText[i];
              return availableChars[Math.floor(Math.random() * availableChars.length)];
            }).join('');
          }
        }

        function render() {
          const letters = displayText.split('');
          visualSpan.innerHTML = letters.map((ch, idx) => {
            const isRevealedOrDone = revealedIndices.has(idx) || !isScrambling || !isHovering;
            const spanClass = isRevealedOrDone ? className : encryptedClassName;
            return `<span class="${spanClass}">${ch === ' ' ? '&nbsp;' : ch}</span>`;
          }).join('');
          srSpan.textContent = displayText;
        }

        function stopScramble(finalText = text, complete = false) {
          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
          }
          isScrambling = false;
          displayText = finalText;
          revealedIndices = new Set(Array.from({ length: text.length }, (_, i) => i));
          render();

          if (complete && !finished) {
            finished = true;
            // add glitch effect to container
            container.classList.add('glitch-active');
            // set data-text attribute for pseudo-elements
            container.setAttribute('data-text', text);
            if (onComplete) onComplete();
          }
        }

        function startScrambling() {
          if (intervalId) stopScramble(text, false);
          isScrambling = true;
          let currentIter = 0;

          intervalId = setInterval(() => {
            if (!isHovering && animateOn !== 'view' && animateOn !== 'both') {
              stopScramble(text, false);
              return;
            }

            if (sequential) {
              if (revealedIndices.size < text.length) {
                const nextIdx = getNextIndex(revealedIndices);
                const newSet = new Set(revealedIndices);
                newSet.add(nextIdx);
                revealedIndices = newSet;
                displayText = shuffleText(text, revealedIndices);
                render();
              } else {
                // fully revealed – trigger completion
                stopScramble(text, true);
              }
            } else {
              displayText = shuffleText(text, revealedIndices);
              render();
              currentIter++;
              if (currentIter >= maxIterations) {
                stopScramble(text, true);
              }
            }
          }, speed);
        }

        // event listeners
        const onMouseEnter = () => {
          if (finished) return; // if already glitching, no more decrypt on hover
          if (animateOn === 'hover' || animateOn === 'both') {
            isHovering = true;
            revealedIndices = new Set();
            startScrambling();
          }
        };
        const onMouseLeave = () => {
          if (finished) return;
          if (animateOn === 'hover' || animateOn === 'both') {
            isHovering = false;
            stopScramble(text, false);
          }
        };
        container.addEventListener('mouseenter', onMouseEnter);
        container.addEventListener('mouseleave', onMouseLeave);

        // intersection observer for view trigger
        if (animateOn === 'view' || animateOn === 'both') {
          const obs = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting && !hasAnimated && !finished) {
                hasAnimated = true;
                isHovering = true;
                revealedIndices = new Set();
                startScrambling();
              }
            });
          }, { threshold: 0.1 });
          obs.observe(container);
        }

        // initial full reveal (no glitch yet)
        stopScramble(text, false);
        return container;
      }

      // --------------------------------------------------------------
      // 2. Magenta falling particles (white + magenta, slow/fast)
      // --------------------------------------------------------------
      function initMagentaParticles() {
        const canvas = document.getElementById('magenta-particles');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        const PARTICLE_COUNT = 260;
        const FAST_RATIO = 0.2;

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
          initParticles();
        }

        function initParticles() {
          particles = [];
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const isFast = Math.random() < FAST_RATIO;
            const baseSpeed = isFast ? 0.06 + Math.random() * 0.15 : 0.008 + Math.random() * 0.02; // slightly slower overall
            let r, g, b;
            const rand = Math.random();
            if (rand < 0.4) {
              r = 255; g = 180; b = 230;
            } else if (rand < 0.8) {
              r = 255; g = 120; b = 200;
            } else {
              r = 255; g = 200; b = 250;
            }

            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              radius: isFast ? Math.random() * 2.2 + 1.0 : Math.random() * 1.5 + 0.7,
              speedY: baseSpeed * (0.7 + Math.random() * 0.6),
              speedX: isFast ? (Math.random() - 0.5) * 0.08 : (Math.random() - 0.5) * 0.015,
              r, g, b,
              brightness: 0.5 + Math.random() * 0.5,
              isFast,
            });
          }
          // shuffle
          for (let i = particles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [particles[i], particles[j]] = [particles[j], particles[i]];
          }
        }

        function update() {
          for (let p of particles) {
            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y > height + 20) {
              p.y = -20;
              p.x = Math.random() * width;
              p.speedY = (p.isFast ? 0.06 + Math.random()*0.15 : 0.008 + Math.random()*0.02);
              p.speedX = p.isFast ? (Math.random()-0.5)*0.08 : (Math.random()-0.5)*0.015;
            }
            if (p.x < -20) p.x = width + 20;
            if (p.x > width + 20) p.x = -20;
          }
        }

        function draw() {
          ctx.clearRect(0, 0, width, height);

          for (let p of particles) {
            const alpha = p.brightness * (0.6 + 0.3 * Math.sin(Date.now() * 0.002 + p.x));
            ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha})`;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            if (p.isFast && p.speedY > 0.03) {
              ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha * 0.25})`;
              ctx.beginPath();
              ctx.arc(p.x - p.speedX * 12, p.y - p.speedY * 10, p.radius * 0.8, 0, Math.PI*2);
              ctx.fill();

              ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha * 0.1})`;
              ctx.beginPath();
              ctx.arc(p.x - p.speedX * 24, p.y - p.speedY * 22, p.radius * 0.5, 0, Math.PI*2);
              ctx.fill();
            }
          }
        }

        function animate() {
          update();
          draw();
          requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
      }

      // --------------------------------------------------------------
      // 3. Mount everything
      // --------------------------------------------------------------
      window.addEventListener('load', () => {
        // headline "TANISHQ" – slower, then glitch
        const headlineContainer = document.getElementById('decrypted-headline');
        const headlineDecrypt = createDecryptedTextWithGlitch({
          text: 'TANISHQ',
          speed: 140,           // slow decryption
          maxIterations: 18,
          sequential: true,
          revealDirection: 'center',
          characters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%&*?+',
          className: 'magenta-revealed',
          parentClassName: 'decrypt-parent',
          encryptedClassName: 'magenta-encrypted',
          animateOn: 'both',
          onComplete: () => console.log('headline glitch activated'),
        });
        headlineContainer.appendChild(headlineDecrypt);

        // tagline – also slower, with glitch after completion
        const taglineContainer = document.getElementById('decrypted-tagline');
        const taglineDecrypt = createDecryptedTextWithGlitch({
          text: 'Engineering the unseen.\n Building what tomorrow hasn’t imagined yet.',
          speed: 100,            // a bit faster than headline but still slow
          maxIterations: 14,
          sequential: false,     // shuffle style
          revealDirection: 'start',
          characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*',
          className: 'magenta-revealed',
          parentClassName: 'tagline-parent',
          encryptedClassName: 'magenta-encrypted',
          animateOn: 'both',
          onComplete: () => console.log('tagline glitch active'),
        });
        taglineContainer.appendChild(taglineDecrypt);

        // start particles
        initMagentaParticles();

        // BUTTON CLICK - redirect to main.html
        document.getElementById('enter-portfolio-btn').addEventListener('click', () => {
          window.location.href = 'main.html';  // redirects to main.html in same folder
        });
      });
    })();
  </script>
</body>
</html>
